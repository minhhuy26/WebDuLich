# ===================================================================
# CẤU HÌNH ỨNG DỤNG QUẢN LÝ ĐẶT VÉ DU LỊCH
# ===================================================================
spring.application.name=web-du-lich
server.port=8080
server.servlet.context-path=

# -------------------------------------------------------------------
# CẤU HÌNH KẾT NỐI SQL SERVER DATABASE
# Host: localhost:1433 | Database: DatVeDuLich | User: sa
# Mật khẩu đọc từ biến môi trường DB_PASSWORD (nếu không set sẽ dùng fallback máy hiện tại)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DatVeDuLich;encrypt=true;trustServerCertificate=true;
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# -------------------------------------------------------------------
# CẤU HÌNH SPRING DATA JPA & HIBERNATE
# Tự động cập nhật / tạo schema bảng tương thích với Entity Java
# -------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# -------------------------------------------------------------------
# CẤU HÌNH THYMELEAF TEMPLATE ENGINE & UTF-8 ENCODING
# -------------------------------------------------------------------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# -------------------------------------------------------------------
# LOGGING
# -------------------------------------------------------------------
logging.level.com.dulich.ticketmanagement=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Demo accounts are opt-in and must never be created by a production startup.
app.demo-data.enabled=false

