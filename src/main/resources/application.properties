# ===================================================================
# CẤU HÌNH ỨNG DỤNG QUẢN LÝ ĐẶT VÉ DU LỊCH
# ===================================================================
spring.application.name=web-du-lich
server.port=8080
server.servlet.context-path=

# -------------------------------------------------------------------
# CẤU HÌNH KẾT NỐI SQL SERVER DATABASE
# Host: localhost:1433 | Database: DatVeDuLich | User: sa
# Mật khẩu đọc từ biến môi trường DB_PASSWORD (nếu không set sẽ dùng fallback máy hiện tại)
# -------------------------------------------------------------------
spring.datasource.url=jdbc:sqlserver://localhost:1433;databaseName=DatVeDuLich;encrypt=true;trustServerCertificate=true;sendStringParametersAsUnicode=true;
spring.datasource.username=sa
spring.datasource.password=${DB_PASSWORD:nguyenhuy2006}
spring.datasource.driver-class-name=com.microsoft.sqlserver.jdbc.SQLServerDriver

# -------------------------------------------------------------------
# CẤU HÌNH SPRING DATA JPA & HIBERNATE
# Giữ nguyên 100% tên bảng khớp với schema.sql (không tự ý đổi thành snake_case có dấu _)
# -------------------------------------------------------------------
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.hibernate.naming.implicit-strategy=org.hibernate.boot.model.naming.ImplicitNamingStrategyLegacyJpaImpl
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.SQLServerDialect

# -------------------------------------------------------------------
# CẤU HÌNH THYMELEAF TEMPLATE ENGINE & UTF-8 ENCODING
# -------------------------------------------------------------------
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false

# -------------------------------------------------------------------
# LOGGING
# -------------------------------------------------------------------
logging.level.com.dulich.ticketmanagement=INFO
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# Demo accounts are opt-in and must never be created by a production startup.
app.demo-data.enabled=false

# -------------------------------------------------------------------
# CẤU HÌNH GỬI EMAIL THÔNG TIN VÉ (GMAIL SMTP)
# Đọc tài khoản và App Password từ biến môi trường để đảm bảo an toàn bảo mật
# -------------------------------------------------------------------
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:587}
spring.mail.username=${SPRING_MAIL_USERNAME:}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
app.mail.from=${APP_MAIL_FROM:VietTravel Hub <support@viettravelhub.vn>}
