<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thông Báo Lỗi - VietTravel Hub</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,400;1,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 40px 0; background: linear-gradient(135deg, #fef2f2 0%, #fee2e2 100%);">

<div class="app-container-sm" style="max-width: 620px;">
    
    <div style="text-align: center; margin-bottom: 24px;">
        <a href="/" style="display: inline-flex; align-items: center; gap: 10px; font-size: 22px; font-weight: 800; color: var(--primary-dark); text-decoration: none;">
            <div class="brand-icon" style="width: 44px; height: 44px;">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
            </div>
            <span>VietTravel Hub</span>
        </a>
    </div>

    <div class="card" style="box-shadow: var(--shadow-xl); border-radius: var(--radius-xl); border-top: 5px solid var(--danger); padding: 36px 32px;">
        
        <div style="display: flex; align-items: center; gap: 14px; margin-bottom: 16px;">
            <div style="width: 48px; height: 48px; border-radius: 50%; background: var(--danger-bg); color: var(--danger); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" x2="12" y1="8" y2="12"/><line x1="12" x2="12.01" y1="16" y2="16"/></svg>
            </div>
            <div>
                <h1 style="font-size: 22px; font-weight: 800; color: var(--danger); margin: 0;" th:text="${error != null ? error : 'Đã có lỗi xảy ra'}">Lỗi hệ thống</h1>
                <small style="color: var(--text-muted);">Mã trạng thái HTTP: <strong th:text="${status}">500</strong></small>
            </div>
        </div>

        <p style="font-size: 15px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 20px;" th:text="${message}">Mô tả chi tiết lỗi</p>

        <!-- VALIDATION ERRORS LIST IF PRESENT -->
        <div th:if="${validationErrors != null and not #maps.isEmpty(validationErrors)}" style="background: var(--surface-alt); padding: 16px; border-radius: var(--radius-md); border: 1px solid var(--border-subtle); margin-bottom: 20px;">
            <div style="font-weight: 700; font-size: 13px; color: var(--danger); margin-bottom: 8px;">Chi tiết các trường thông tin không hợp lệ:</div>
            <ul style="padding-left: 18px; margin: 0; font-size: 13px; color: var(--text-secondary); line-height: 1.6;">
                <li th:each="entry : ${validationErrors}">
                    <strong th:text="${entry.key}"></strong>: <span th:text="${entry.value}"></span>
                </li>
            </ul>
        </div>

        <div style="font-size: 12px; color: var(--text-muted); border-top: 1px solid var(--border-subtle); padding-top: 14px; margin-bottom: 24px;">
            Thời điểm phát sinh lỗi: <span th:text="${#temporals.format(timestamp, 'dd/MM/yyyy HH:mm:ss')}"></span>
        </div>

        <div style="display: flex; gap: 12px;">
            <a href="/" class="btn btn-primary" style="flex: 1;">&larr; Về Trang Chủ</a>
            <button type="button" class="btn btn-secondary" onclick="window.history.back()">Quay lại trang trước</button>
        </div>

    </div>

</div>

</body>
</html>
