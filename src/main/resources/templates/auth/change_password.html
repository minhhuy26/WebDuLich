<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đổi Mật Khẩu Cá Nhân - VietTravel Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <script th:src="@{/js/app.js}" defer></script>
</head>
<body>

    <!-- NAVBAR -->
    <header th:replace="~{fragments/header :: app-navbar('change-password')}"></header>

    <div class="app-container" style="padding-top: 40px; padding-bottom: 70px; max-width: 580px;">

        <!-- BREADCRUMB -->
        <nav style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">
            <a href="/" style="color: var(--primary); text-decoration: none;">Trang chủ</a> / 
            <a href="/my-bookings" style="color: var(--primary); text-decoration: none;">Tài khoản</a> / 
            <strong>Đổi mật khẩu</strong>
        </nav>

        <!-- FLASH NOTICES -->
        <div th:if="${errorMessage}" class="alert alert-danger" style="margin-bottom: 20px;" th:text="${errorMessage}"></div>
        <div th:if="${successMessage}" class="alert alert-success" style="margin-bottom: 20px;" th:text="${successMessage}"></div>

        <div class="card" style="padding: 36px 32px; border-radius: var(--radius-xl); box-shadow: var(--shadow-lg);">
            <div style="text-align: center; margin-bottom: 26px;">
                <div style="width: 52px; height: 52px; background: var(--primary-subtle); color: var(--primary); border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-bottom: 12px;">
                    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                </div>
                <h1 style="font-size: 24px; font-weight: 800; color: var(--text-primary); margin-bottom: 6px;">
                    Đổi Mật Khẩu Cá Nhân
                </h1>
                <p style="font-size: 13.5px; color: var(--text-muted); margin: 0;">
                    Tài khoản: <strong style="color: var(--primary);" th:text="${currentUser != null ? currentUser.username : ''}">user</strong> &bull;
                    <span th:text="${currentUser != null ? currentUser.fullName : ''}">Nguyễn Văn A</span>
                </p>
            </div>

            <form method="post" th:action="@{/change-password}">
                <div style="margin-bottom: 18px;">
                    <label class="form-label" style="font-weight: 600;">Mật khẩu hiện tại *</label>
                    <input type="password" name="currentPassword" class="form-control" placeholder="Nhập mật khẩu bạn đang sử dụng" required />
                </div>

                <div style="margin-bottom: 18px;">
                    <label class="form-label" style="font-weight: 600;">Mật khẩu mới *</label>
                    <input type="password" name="newPassword" class="form-control" placeholder="Tối thiểu 6 ký tự" minlength="6" required />
                    <small style="color: var(--text-muted); font-size: 12px;">Nên dùng kết hợp chữ hoa, chữ thường và số để tăng tính bảo mật.</small>
                </div>

                <div style="margin-bottom: 26px;">
                    <label class="form-label" style="font-weight: 600;">Xác nhận mật khẩu mới *</label>
                    <input type="password" name="confirmPassword" class="form-control" placeholder="Nhập lại mật khẩu mới" minlength="6" required />
                </div>

                <div style="display: flex; gap: 12px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1; padding: 12px; font-weight: 700; font-size: 15px;">
                        Cập Nhật Mật Khẩu
                    </button>
                    <a href="/my-bookings" class="btn btn-outline" style="padding: 12px 20px;">
                        Hủy Bỏ
                    </a>
                </div>
            </form>
        </div>

    </div>

    <!-- FOOTER -->
    <footer th:replace="~{fragments/footer :: app-footer}"></footer>

</body>
</html>
