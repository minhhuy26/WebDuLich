<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xác Thực Đơn Vé - VietTravel Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body style="min-height: 100vh; display: flex; flex-direction: column;">
    <!-- NAVBAR -->
    <header th:replace="~{fragments/header :: app-navbar('none')}"></header>

    <main class="main-content" style="padding-top: 50px; padding-bottom: 60px; flex: 1;">
        <div class="app-container-sm" style="max-width: 520px;">
            <section class="card" style="padding: 36px 32px; box-shadow: var(--shadow-lg); border-radius: var(--radius-xl);">
                <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 16px;">
                    <div style="width: 44px; height: 44px; border-radius: 50%; background: var(--surface-alt); color: var(--primary); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    </div>
                    <h1 style="font-size: 22px; font-weight: 800; color: var(--text-primary); margin: 0;">Xác Thực Bảo Mật Đơn Vé</h1>
                </div>
                
                <p style="color: var(--text-secondary); line-height: 1.6; margin-bottom: 24px; font-size: 14px;">
                    Để bảo vệ thông tin cá nhân của hành khách, vui lòng nhập số điện thoại người đặt vé có mã đơn 
                    <strong style="color: var(--primary); font-family: var(--font-mono);" th:text="${bookingCode}">MÃ ĐƠN</strong>.
                </p>
                <form method="get" th:action="${lookupAction}">
                    <label for="phone" class="form-label">Số điện thoại người đặt vé *</label>
                    <input id="phone" name="phone" type="tel" class="form-control"
                           inputmode="numeric" autocomplete="tel" pattern="0[0-9]{9,10}"
                           placeholder="Ví dụ: 0912345678" required style="font-size: 15px; padding: 12px;">
                    <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 20px; padding: 12px; font-weight: 700; font-size: 15px;">
                        Xác Thực &amp; Xem Đơn Vé
                    </button>
                </form>
                <p style="font-size: 13px; color: var(--text-muted); margin: 18px 0 0; text-align: center;">
                    Nếu quý khách gặp khó khăn, vui lòng liên hệ hotline <strong style="color: var(--primary);">1900 6868</strong> để được hỗ trợ.
                </p>
            </section>
        </div>
    </main>

    <!-- FOOTER -->
    <footer th:replace="~{fragments/footer :: app-footer}"></footer>
</body>
</html>
