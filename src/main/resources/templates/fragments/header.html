<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security" lang="vi">
<head>
    <meta charset="UTF-8">
</head>
<body>

    <!-- COMPREHENSIVE NAVBAR FRAGMENT -->
    <header th:fragment="app-navbar(activePage)" class="navbar-wrapper">
        <div class="app-container">
            <nav class="navbar">
                <a href="/" class="nav-brand">
                    <div class="brand-icon">
                        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polygon points="3 11 22 2 13 21 11 13 3 11"></polygon></svg>
                    </div>
                    <span>VietTravel Hub</span>
                </a>

                <ul class="nav-menu">
                    <li>
                        <a href="/" class="nav-link" th:classappend="${activePage == 'home'} ? ' active' : ''" th:attr="aria-current=${activePage == 'home'} ? 'page' : null">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                            Trang Chủ
                        </a>
                    </li>
                    <li>
                        <a href="/flights" class="nav-link" th:classappend="${activePage == 'flights'} ? ' active' : ''" th:attr="aria-current=${activePage == 'flights'} ? 'page' : null">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.8 19.2 16 11l3.5-3.5C21 6 21.5 4 21 3c-1-.5-3 0-4.5 1.5L13 8 4.8 6.2c-.5-.1-.9.1-1.1.5l-.3.5c-.2.5-.1 1 .3 1.3L9 12l-2 3H4l-1 1 3 2 2 3 1-1v-3l3-2 3.5 5.3c.3.4.8.5 1.3.3l.5-.2c.4-.3.6-.7.5-1.2z"/></svg>
                            Vé Máy Bay
                        </a>
                    </li>
                    <li>
                        <a href="/trains" class="nav-link" th:classappend="${activePage == 'trains'} ? ' active' : ''" th:attr="aria-current=${activePage == 'trains'} ? 'page' : null">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="16" height="16" x="4" y="3" rx="2"/><path d="M4 11h16"/><path d="M12 3v8"/><path d="m8 19-2 3"/><path d="m18 22-2-3"/><circle cx="8" cy="15" r="1"/><circle cx="16" cy="15" r="1"/></svg>
                            Vé Tàu Hỏa
                        </a>
                    </li>
                    <li>
                        <a href="/consultations/new" class="nav-link" th:classappend="${activePage == 'consultation'} ? ' active' : ''" th:attr="aria-current=${activePage == 'consultation'} ? 'page' : null">
                            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect width="18" height="18" x="3" y="4" rx="2" ry="2"/><line x1="16" x2="16" y1="2" y2="6"/><line x1="8" x2="8" y1="2" y2="6"/><line x1="3" x2="21" y1="10" y2="10"/></svg>
                            Hẹn Tư Vấn
                        </a>
                    </li>
                </ul>

                <div class="nav-actions">
                    <!-- Chưa đăng nhập -->
                    <span sec:authorize="isAnonymous()" style="display: flex; gap: 8px; align-items: center;">
                        <a href="/flights/bookings" class="btn btn-outline btn-sm">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" x2="8" y1="13" y2="13"/></svg>
                            Đơn Đã Đặt
                        </a>
                        <a href="/login" class="btn btn-secondary btn-sm">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
                            Đăng Nhập
                        </a>
                        <a href="/register" class="btn btn-primary btn-sm">
                            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="8.5" cy="7" r="4"/><line x1="20" y1="8" x2="20" y2="14"/><line x1="23" y1="11" x2="17" y2="11"/></svg>
                            Đăng Ký
                        </a>
                    </span>

                    <!-- Đã đăng nhập -->
                    <span sec:authorize="isAuthenticated()" style="display: flex; gap: 8px; align-items: center;">
                        <span sec:authorize="hasRole('KHACH')">
                            <a href="/my-bookings" class="btn btn-outline btn-sm" th:classappend="${activePage == 'bookings'} ? ' active' : ''">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21v-2a4 4 0 0 0-4-4H9a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                                Đơn Của Tôi
                            </a>
                        </span>
                        <span sec:authorize="hasAnyRole('NHANVIEN', 'ADMIN')">
                            <a href="/admin" class="btn btn-cta btn-sm">
                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                                Quản Trị Hệ Thống
                            </a>
                        </span>
                        <form method="post" th:action="@{/logout}" style="margin: 0; display: inline;">
                            <button type="submit" class="btn btn-danger-outline btn-sm">
                                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                                Thoát
                            </button>
                        </form>
                    </span>
                </div>
            </nav>
        </div>
    </header>

</body>
</html>
